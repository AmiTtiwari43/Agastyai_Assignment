spring:
  application:
    name: reliable-webhook-delivery-service-test
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

webhooks:
  allow-internal-urls: true
  worker:
    enabled: false
    batch-size: 10
    poll-interval-ms: 500
    lease-duration-seconds: 10
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  retry:
    max-attempts: 8
    base-delay-seconds: 30
    max-delay-seconds: 21600
    jitter-percent: 0.15
  circuit-breaker:
    failure-threshold: 5
    cooldown-seconds: 5

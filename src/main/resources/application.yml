server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: reliable-webhook-delivery-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:webhooks}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

webhooks:
  allow-internal-urls: ${ALLOW_INTERNAL_URLS:false}
  worker:
    enabled: ${WORKER_ENABLED:true}
    instance-id: ${WORKER_INSTANCE_ID:worker-${random.uuid}}
    batch-size: ${WORKER_BATCH_SIZE:50}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:1000}
    lease-duration-seconds: ${WORKER_LEASE_DURATION_SECONDS:120}
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:10000}
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:8}
    base-delay-seconds: ${RETRY_BASE_DELAY_SECONDS:30}
    max-delay-seconds: ${RETRY_MAX_DELAY_SECONDS:21600}
    jitter-percent: ${RETRY_JITTER_PERCENT:0.15}
  circuit-breaker:
    failure-threshold: ${CB_FAILURE_THRESHOLD:5}
    cooldown-seconds: ${CB_COOLDOWN_SECONDS:60}
